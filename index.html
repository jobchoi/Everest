<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카메라 수동 진단 V9</title>
    <!-- 라이브러리 로드 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background: #eee; color: #333; font-family: sans-serif; padding: 20px; text-align: center; }
        h2 { color: #3f51b5; }
        #log-area { 
            background: #222; color: #0f0; padding: 10px; 
            height: 150px; overflow-y: scroll; text-align: left; 
            font-family: monospace; font-size: 0.8rem; margin-bottom: 20px; border-radius: 5px;
        }
        .cam-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: white; border: 2px solid #3f51b5; color: #3f51b5;
            font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer;
        }
        .cam-btn:active { background: #3f51b5; color: white; }
        #reader { width: 100%; height: 300px; background: black; margin-top: 20px; }
    </style>
</head>
<body>

<h2>📸 카메라 수동 선택 V9</h2>

<!-- 로그창 -->
<div id="log-area">로그 대기중...</div>

<!-- 카메라 목록 버튼이 여기에 생김 -->
<div id="cam-list">
    <button class="cam-btn" onclick="getCameras()">📡 1. 카메라 목록 가져오기 (터치)</button>
</div>

<!-- 카메라 화면 -->
<div id="reader"></div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    function log(msg) {
        const area = document.getElementById('log-area');
        const time = new Date().toLocaleTimeString();
        area.innerHTML = `[${time}] ${msg}<br>` + area.innerHTML;
        console.log(msg);
    }

    // 1. 카메라 목록 가져오기 (핵심)
    function getCameras() {
        log("카메라 목록 요청 중...");
        
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                log(`성공! 카메라 ${devices.length}개 발견됨.`);
                
                const listDiv = document.getElementById('cam-list');
                listDiv.innerHTML = ""; // 기존 버튼 지우기

                devices.forEach((device, index) => {
                    // 버튼 생성
                    const btn = document.createElement("button");
                    btn.className = "cam-btn";
                    // 카메라 이름 출력 (후면/전면 구분용)
                    btn.innerText = `📷 카메라 ${index+1}: ${device.label || "이름없음"}`;
                    btn.onclick = () => startSpecificCamera(device.id);
                    listDiv.appendChild(btn);
                });
            } else {
                log("목록은 가져왔으나 카메라가 0개입니다.");
            }
        }).catch(err => {
            log("❌ 목록 가져오기 실패!");
            // 에러 객체를 문자열로 풀어서 보여줌 (undefined 방지)
            log("에러 내용: " + JSON.stringify(err, Object.getOwnPropertyNames(err)));
            alert("카메라 권한이 차단되었거나, HTTPS가 아닙니다.");
        });
    }

    // 2. 특정 카메라 시작하기
    function startSpecificCamera(cameraId) {
        log(`카메라 ID 로 시작 시도...`);
        
        html5QrCode.start(
            cameraId, // 선택한 그 카메라 ID 사용
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            },
            (decodedText, decodedResult) => {
                log(`✅ 스캔 성공: ${decodedText}`);
                alert(`인식됨: ${decodedText}`);
                html5QrCode.stop();
            },
            (errorMessage) => {
                // 스캔 중 에러는 무시
            }
        ).catch(err => {
            log("❌ 카메라 시작 실패!");
            log("상세 에러: " + JSON.stringify(err, Object.getOwnPropertyNames(err)));
            
            // 혹시 또 undefined가 뜰까봐 강제 출력
            if (!err) log("에러 객체가 null/undefined 입니다.");
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카메라 정밀 진단 V8</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 15px; word-break: break-all; }
        h2 { border-bottom: 1px solid #0f0; padding-bottom: 10px; }
        .box { border: 1px solid #555; padding: 10px; margin-bottom: 15px; background: #222; }
        .error { color: #ff5252; font-weight: bold; }
        .success { color: #69f0ae; font-weight: bold; }
        button { width: 100%; padding: 15px; font-size: 1.2rem; background: #004d40; color: #fff; border: 1px solid #0f0; margin-bottom: 20px; cursor: pointer;}
        #reader { width: 100%; background: #000; margin-bottom: 20px; }
    </style>
</head>
<body>

<h2>🕵️ 시스템 진단 로그</h2>

<div id="status-box" class="box">준비됨</div>

<button onclick="startDiagnosis()">🚀 진단 및 카메라 시작</button>

<div id="camera-list" class="box">카메라 목록 대기중...</div>
<div id="reader"></div>

<script>
    function log(msg, type = 'normal') {
        const box = document.getElementById('status-box');
        const color = type === 'error' ? 'red' : (type === 'success' ? '#69f0ae' : '#0f0');
        const time = new Date().toTimeString().split(' ')[0];
        box.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
    }

    async function startDiagnosis() {
        document.getElementById('status-box').innerHTML = ""; // 로그 초기화
        log("진단 시작...");

        // 1. 보안 컨텍스트 확인
        if (window.isSecureContext) {
            log("✅ Secure Context (HTTPS): OK", 'success');
        } else {
            log("❌ Secure Context Fail! (HTTP임)", 'error');
            log("👉 HTTPS 주소나 localhost를 사용하세요.", 'error');
            return;
        }

        // 2. 브라우저 지원 확인
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
            log("❌ 이 브라우저는 카메라 API를 지원하지 않습니다.", 'error');
            return;
        }

        // 3. 카메라 권한 및 장치 검색
        try {
            log("장치 권한 요청 중...");
            // 일단 스트림을 요청해야 권한 팝업이 뜸
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            log("✅ 권한 획득 성공!", 'success');
            
            // 스트림 잠시 끄기 (스캐너 라이브러리와 충돌 방지)
            stream.getTracks().forEach(track => track.stop());

            // 장치 목록 나열
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter(d => d.kind === 'videoinput');
            
            if (cameras.length === 0) {
                log("❌ 연결된 카메라가 없습니다.", 'error');
                document.getElementById('camera-list').innerText = "발견된 카메라 없음";
            } else {
                log(`✅ 카메라 ${cameras.length}개 발견됨`, 'success');
                let camListText = "";
                cameras.forEach((cam, idx) => {
                    camListText += `[${idx}] ${cam.label || '알 수 없는 카메라'} (ID: ${cam.deviceId.substring(0,10)}...)\n`;
                });
                document.getElementById('camera-list').innerText = camListText;
            }

            // 4. 스캐너 라이브러리 구동
            startLibrary();

        } catch (err) {
            handleError(err);
        }
    }

    function handleError(err) {
        log(`❌ 에러 발생: ${err.name}`, 'error');
        log(`메시지: ${err.message}`, 'error');

        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            log("👉 [해결책] 브라우저 주소창 옆 자물쇠를 눌러 '권한 재설정' 하세요.", 'error');
        } else if (err.name === 'NotFoundError') {
            log("👉 [해결책] 카메라 장치를 찾을 수 없습니다. 하드웨어를 확인하세요.", 'error');
        } else if (err.name === 'NotReadableError') {
            log("👉 [해결책] 다른 앱이 카메라를 쓰고 있습니다. 모든 앱을 닫고 다시 시도하세요.", 'error');
        }
    }

    function startLibrary() {
        log("라이브러리 초기화 중...");
        const html5QrCode = new Html5Qrcode("reader");
        
        // 후면 카메라 우선, 실패시 아무거나
        const config = { fps: 10, qrbox: 250 };
        
        html5QrCode.start(
            { facingMode: { ideal: "environment" } }, 
            config,
            (decodedText) => {
                log(`🎉 스캔 성공: ${decodedText}`, 'success');
                html5QrCode.stop(); // 성공하면 멈춤
            },
            (errorMessage) => {
                // 스캔 중 에러는 무시 (로그 오염 방지)
            }
        ).catch(err => {
            log("라이브러리 구동 실패", 'error');
            handleError(err);
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마트 카메라 (모바일 수정판)</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Jua', sans-serif; background: #222; color: white; margin: 0; padding: 0; }
        header { padding: 15px; text-align: center; background: #444; }
        
        #reader { width: 100%; background: black; }
        
        #console-log {
            background: #333; color: #0f0; font-family: monospace;
            padding: 10px; font-size: 0.8rem; height: 100px; overflow-y: scroll;
            border-top: 1px solid #666;
        }

        #result-area {
            background: white; color: black; padding: 20px;
            border-radius: 15px 15px 0 0; text-align: center;
        }
        #p-name { font-size: 2rem; font-weight: bold; margin: 10px 0; }
        #p-price { font-size: 2.5rem; color: #E91E63; font-weight: 900; }
        
        button {
            padding: 10px 20px; font-size: 1.2rem; border-radius: 8px;
            border: none; cursor: pointer; margin-top: 10px; width: 100%;
        }
        .btn-start { background: #4CAF50; color: white; }
        .btn-reset { background: #2196F3; color: white; }
    </style>
</head>
<body>

<header>📷 마트 카메라 V5.5</header>

<div id="result-area">
    <div id="p-name">준비됨</div>
    <div id="p-price">---</div>
    <!-- 모바일에서는 자동 시작이 막힐 수 있어 버튼 추가 -->
    <button id="start-btn" class="btn-start" onclick="startCamera()">📸 카메라 켜기 (터치)</button>
    <button class="btn-reset" onclick="resetData()">🔄 초기화</button>
</div>

<!-- 카메라 화면 -->
<div id="reader"></div>

<!-- 디버깅 로그창 -->
<div id="console-log">로그 대기중...<br></div>

<script>
    // === 1. 간단 DB ===
    const productDB = {
        "8801111222233": { name: "맛있는 우유", price: 1200 },
        "12345678": { name: "로봇 장난감", price: 5000 },
        "8801062638363": { name: "캔디", price: 500 },
        // 테스트용: 우유팩이나 과자봉지를 준비하세요
    };

    let html5QrcodeScanner = null;

    // === 2. 화면에 로그 찍기 (폰에서 확인용) ===
    function log(msg) {
        const logBox = document.getElementById('console-log');
        const time = new Date().toLocaleTimeString();
        logBox.innerHTML = `[${time}] ${msg}<br>` + logBox.innerHTML;
        console.log(msg);
    }

    // === 3. 카메라 시작 함수 ===
    function startCamera() {
        document.getElementById('start-btn').style.display = 'none'; // 버튼 숨김
        log("카메라 권한 요청 중...");

        // 기존 스캐너가 있다면 제거
        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear();
        }

        // 스캐너 설정
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 }, // 인식 영역
                aspectRatio: 1.0,
                // 모바일 후면 카메라 우선 사용 설정
                videoConstraints: { 
                    facingMode: { exact: "environment" } 
                }
            },
            /* verbose= */ true
        );

        // 렌더링 시작 (성공 콜백, 에러 콜백)
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        
        // 혹시 facingMode: exact가 지원 안되는 기기를 위한 예외처리
        // (위 코드가 에러나면 아래 코드가 실행되지 않지만, 라이브러리 내부 에러 처리를 믿습니다)
    }

    // 성공 시
    function onScanSuccess(decodedText, decodedResult) {
        log("스캔 성공: " + decodedText);
        
        // 소리 재생 시도 (사용자 인터랙션 필요할 수 있음)
        playBeep();

        if (productDB[decodedText]) {
            const p = productDB[decodedText];
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-price').innerText = "₩" + p.price.toLocaleString();
            log("상품 인식됨: " + p.name);
            
            // 성공했으면 잠시 스캔 중지 (UI 피드백)
            html5QrcodeScanner.pause();
            setTimeout(() => {
                html5QrcodeScanner.resume();
            }, 2000);
        } else {
            document.getElementById('p-name').innerText = "미등록 상품";
            document.getElementById('p-price').innerText = decodedText;
        }
    }

    // 실패 시 (매 프레임마다 호출됨 - 로그 너무 많이 쌓이니 주의)
    function onScanFailure(error) {
        // console.warn(`Code scan error = ${error}`);
        // 화면 로그에는 찍지 않음 (너무 빨라서)
    }

    // === 4. 일반적인 에러 핸들링 (중요) ===
    // 라이브러리 로드 실패 혹은 권한 거부 등을 잡기 위함
    window.onerror = function(msg, url, line) {
        log("❌ 에러 발생: " + msg);
        alert("에러: " + msg); // 팝업으로도 띄움
    };

    function resetData() {
        document.getElementById('p-name').innerText = "준비됨";
        document.getElementById('p-price').innerText = "---";
        log("초기화됨");
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }
</script>

</body>
</html>
